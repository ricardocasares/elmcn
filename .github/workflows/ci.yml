name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format, validate registry, check registry against sources
        run: bun run check
      - name: Install every item into a fresh Elm app and compile it
        run: bun run test:install
      - name: Build the gallery
        run: bun run build
